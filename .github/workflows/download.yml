# Keeps one download of the whole folder on GitHub for computers that don't have
# Git. Every change to main rebuilds it, and the link to it stays the same:
# https://github.com/BLHS-CS-Club/BLHS-Island-Explorer/releases/download/download/cs-club-islands.zip
name: download

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download
  cancel-in-progress: true

jobs:
  zip:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # the files sit at the top of the zip, so unzipping gives one folder with play.py right in it
      - name: zip the folder the way a member opens it
        run: |
          git archive --format=zip -o cs-club-islands.zip HEAD \
            play.py play.cmd grape.py vine.py islands.json README.md practice examples islands tools tests docs .vscode

      # python isn't on the school computers and a student can't always install it, so the zip brings
      # its own, the official windows build that runs out of a folder, and play.cmd uses it when it's there.
      # the hash is the one python.org's file had when this was written, so a changed file stops the build
      - name: put python in the zip
        run: |
          curl -fsSL -o python-embed.zip https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip
          echo "009d6bf7e3b2ddca3d784fa09f90fe54336d5b60f0e0f305c37f400bf83cfd3b  python-embed.zip" | sha256sum -c -
          unzip -q python-embed.zip -d python
          zip -qr cs-club-islands.zip python

      - name: put it where the link points
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view download > /dev/null 2>&1; then
            gh release create download --title "The folder, for a computer without Git" \
              --notes "Download cs-club-islands.zip, unzip it, open that folder in VS Code, open practice/starter/island.py and press the run button."
          fi
          gh release upload download cs-club-islands.zip --clobber
