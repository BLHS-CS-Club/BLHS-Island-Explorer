<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play · BLHS Island Explorer</title>
<link rel="stylesheet" href="/club/lib/club.css">
<style>
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 330px 1fr; gap: 14px; padding: 14px; }
  .side { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .pick { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
  .pick select { width: 100%; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tick { font-family: var(--label); font-size: 15px; display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .saved { font-family: var(--label); font-size: 14px; color: var(--ink-soft); min-height: 20px; }
  .wrong { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .wrong .msgs { flex: 1; min-height: 0; }
  .gamebox { min-height: 0; }
  .note { font-size: 14px; color: var(--ink-soft); margin: 0; }
  @media (max-width: 900px) {
    body { height: auto; overflow: auto; }
    main { grid-template-columns: 1fr; }
    .gamebox { height: 62vh; }
  }
</style>
</head>
<body>
<header class="plank">
  <a class="name" href="/club/">BLHS Island Explorer<small>play</small></a>
  <nav>
    <a class="here" href="/club/play/">Play</a>
    <a href="/club/try/">Try</a>
    <a href="/club/">Guides</a>
  </nav>
  <span class="spacer"></span>
  <button class="btn go" id="again" title="Start the island over">Start over</button>
</header>

<main>
  <div class="side">
    <section class="paper">
      <h2>Your island</h2>
      <div class="pick">
        <label class="field">Which island
          <select id="island"></select>
        </label>
        <label class="field">Start at
          <select id="spot"></select>
        </label>
        <label class="tick"><input type="checkbox" id="fresh" checked> Start as a new player every time</label>
        <div class="saved" id="saved"></div>
        <p class="note" id="mapnote"></p>
      </div>
    </section>
    <section class="paper wrong">
      <h2>What went wrong</h2>
      <div class="msgs" id="msgs"></div>
    </section>
  </div>
  <div class="gamebox" id="box"><div class="wait">Loading the game.</div></div>
</main>

<script type="module">
import { createStage, fillSpots, whereIsMap, PRACTICE_MAP } from '/club/lib/stage.js'

const $ = (id) => document.getElementById(id)
// Reads the island's files, so an error that names a thing can be given its line.
async function sources() {
  const out = {}
  const folder = `/grapes/${current}/`
  const manifest = await (await fetch(folder + 'island.json', { cache: 'no-store' })).json()
  for (const name of manifest.modules || []) {
    out[name] = await (await fetch(folder + name, { cache: 'no-store' })).text()
  }
  return out
}
const stage = createStage({ box: $('box'), list: $('msgs'), files: sources })
const GROUPS = { islands: 'Islands', practice: 'Practice', learn: 'Examples from the guides' }

let islands = []
let current = null     // the island being played
let seen = 0           // its stamp the last time we looked
let map = PRACTICE_MAP
let platform = false

const remember = (key, value) => { try { localStorage.setItem(key, value) } catch (e) {} }
const recall = (key) => { try { return localStorage.getItem(key) } catch (e) { return null } }

async function state() {
  const res = await fetch('/_play/state', { cache: 'no-store' })
  return (await res.json()).islands
}

function fillIslands() {
  const sel = $('island')
  sel.replaceChildren()
  for (const root of Object.keys(GROUPS)) {
    const rows = islands.filter((i) => i.root === root)
    if (!rows.length) continue
    const group = document.createElement('optgroup')
    group.label = GROUPS[root]
    for (const row of rows) {
      const opt = document.createElement('option')
      opt.value = row.id
      opt.textContent = row.title === row.id ? row.id : `${row.id}  (${row.title})`
      group.append(opt)
    }
    sel.append(group)
  }
}

function showProblems(row) {
  row.problems.forEach((p, i) => {
    const m = /^([a-z_]+\.py), line (\d+): (.*)$/.exec(p)
    if (m) {
      // The line after it, when it starts with spaces, is the line of code itself.
      const code = (row.problems[i + 1] || '').startsWith('    ') ? row.problems[i + 1].trim() : ''
      stage.say({
        kind: 'error', title: 'Python could not read your file', where: `${m[1]}, line ${m[2]}`,
        detail: code ? `${m[3]}\n\n${code}` : m[3],
        hint: 'Fix that line and save. The game starts again on its own.',
      })
    } else if (!p.startsWith('    ')) {
      stage.say({ kind: 'warn', title: 'island.json', detail: p.replace(/^island\.json: /, '') })
    }
  })
}

// True when Python can't even read one of the files. The game would only say the same thing less clearly.
const unreadable = (row) => row.problems.some((p) => /^[a-z_]+\.py, line \d+:/.test(p))

function play() {
  const row = islands.find((i) => i.id === current)
  if (!row) return
  seen = row.stamp
  if (unreadable(row)) {
    stage.empty()
    $('box').replaceChildren(Object.assign(document.createElement('div'), { className: 'wait', textContent: 'Waiting for you to fix the line on the left.' }))
    showProblems(row)
    return
  }
  stage.run({
    grape: `/grapes/${row.id}/`,
    map,
    at: $('spot').value,
    fresh: $('fresh').checked,
    platform,
  })
  showProblems(row)
}

async function choose(id) {
  current = id
  remember('club:island', id)
  const row = islands.find((i) => i.id === id)
  $('island').value = id

  // Find out whether the island's own map exists yet. If not, borrow the CS Club room.
  const wanted = row.map || PRACTICE_MAP
  const where = await whereIsMap(wanted)
  platform = where === 'mapvis'
  map = where === 'missing' ? PRACTICE_MAP : wanted
  $('mapnote').textContent = where === 'missing'
    ? `This island's map (${wanted}) isn't painted yet, so it's running in the CS Club room for now.`
    : where === 'mapvis' ? `Map: ${wanted}, read from MAPVIS.` : `Map: ${wanted}`

  const spots = await fillSpots($('spot'), map, `club:spot:${id}`)
  // A link can pick the spot too: ?island=starter&at=host
  const at = new URLSearchParams(location.search).get('at')
  if (at && spots.some((s) => s.name === at)) $('spot').value = at
  play()
}

$('island').onchange = () => choose($('island').value)
$('spot').addEventListener('picked', play)
$('again').onclick = play
$('fresh').onchange = () => remember('club:fresh', $('fresh').checked ? '1' : '0')
if (recall('club:fresh') === '0') $('fresh').checked = false

// Look for saved files a few times a second. A newer stamp means start the island over.
async function watch() {
  try {
    islands = await state()
    const row = islands.find((i) => i.id === current)
    if (row && row.stamp !== seen) {
      $('saved').textContent = `Saved at ${new Date().toLocaleTimeString()}. Started over.`
      play()
    }
    if ($('island').options.length !== islands.length) { fillIslands(); $('island').value = current }
  } catch (e) {
    $('saved').textContent = 'play.py has stopped. Run it again, then reload this page.'
  }
  setTimeout(watch, 700)
}

islands = await state()
fillIslands()
const asked = new URLSearchParams(location.search).get('island')
const first = [asked, recall('club:island')].find((id) => islands.some((i) => i.id === id))
  || (islands.find((i) => i.root === 'practice') || islands[0] || {}).id
if (first) await choose(first)
else stage.say({ kind: 'warn', title: 'No islands here yet', detail: 'Copy practice/starter to a new folder to make your first one.' })
watch()
</script>
</body>
</html>
